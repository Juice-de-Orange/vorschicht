# =============================================================================
# Stage 1 vhost — HTTP only, serves the ACME challenge.
#
# Installed before a certificate exists so nginx can start at all; certbot then
# validates over this vhost, after which install-host.sh swaps in the full TLS
# configuration. Two stages instead of certbot's --nginx plugin because the
# plugin rewrites the config file in place, which makes the install script
# non-idempotent and the checked-in vhost a lie about what is running.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name vorschicht.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Vorschicht: TLS wird noch eingerichtet.\n";
        default_type text/plain;
    }
}
