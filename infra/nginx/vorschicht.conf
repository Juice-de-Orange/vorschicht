# =============================================================================
# vorschicht.example.com — the only public entry (§2, §19).
#
# nginx terminates TLS on the production host and proxies to the app on loopback. The app
# publishes its port to 127.0.0.1 only, so this file is not merely the intended
# path in — it is the only reachable one.
#
# Two details that are load-bearing rather than decorative:
#
#   * `/events` disables proxy buffering and raises the read timeout. An SSE
#     stream behind a buffering proxy delivers nothing until the buffer fills,
#     which looks exactly like "the dashboard is frozen" (§17).
#   * Auth endpoints are rate-limited. The dashboard is deliberately public
#     (§2), so WebAuthn plus rate limiting plus the audit log are the
#     compensating controls that decision rests on.
# =============================================================================

# 5 requests/second per IP with a burst of 10, applied only to the auth
# ceremony. Registration and login are inherently low-volume; anything faster
# is either a bug or an attack.
limit_req_zone $binary_remote_addr zone=vorschicht_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vorschicht.example.com;

    # Keep the challenge path reachable so renewals do not need a config swap.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # A host whose port 443 is already owned by another proxy (for example an
    # nginx `stream` block doing SNI passthrough) needs an adapted listen line:
    # http and stream cannot share a port, nginx accepts such a config in
    # `nginx -t` and then fails the *reload* with "still could not bind()",
    # silently keeping the previous configuration while systemd reports
    # success. install-host.sh checks the journal for exactly that after the
    # reload. Terminating TLS on a private port behind such a router with
    # `proxy_protocol` works, but then the real client address must be
    # restored (`set_real_ip_from` / `real_ip_header proxy_protocol`), because
    # the auth rate limiting and the audit log both depend on it.
    #
    # `listen … ssl http2` rather than the standalone `http2 on;` directive:
    # nginx 1.24 does not have the separate directive yet.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vorschicht.example.com;

    ssl_certificate     /etc/letsencrypt/live/vorschicht.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vorschicht.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vorschicht_ssl:10m;
    ssl_session_timeout 1d;
    # No OCSP stapling: Let's Encrypt stopped putting responder URLs in its
    # certificates, so enabling it only produces a startup warning and no
    # stapling. §11 has no warning mode — a config that warns on every reload
    # is a config nobody reads.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The PWA is installable; uploads to the document vault (§13) can be large.
    client_max_body_size 64m;

    access_log /var/log/nginx/vorschicht.access.log;
    error_log  /var/log/nginx/vorschicht.error.log;

    # --- SSE: the live event stream (§17) ---
    location /events {
        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        '';

        # Without these three the stream is silently withheld until a buffer
        # fills — indistinguishable from a hung dashboard.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- auth ceremony: rate limited (§19) ---
    location /api/auth/ {
        limit_req zone=vorschicht_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Kompression, und sie fehlte (A146).
    #
    # Die globale nginx.conf des Produktionshosts setzt `gzip on;`, laesst aber `gzip_types`
    # auskommentiert — und nginx komprimiert dann **nur** `text/html`. Vom
    # Browser gegen den echten Host gemessen: Kompressionsfaktor 1,00 auf ein
    # 402-kB-Bundle. Dazu kommt `gzip_proxied`: ohne das komprimiert nginx eine
    # weitergereichte Antwort gar nicht, und hier wird alles weitergereicht.
    #
    # Gemessen, was es bringt: derselbe Bundle ueber `vite preview` mit gzip und
    # derselben Drosselung braucht 1.948–2.056 ms statt 2.852–2.928 ms. Rund
    # 900 ms haengen an diesen drei Zeilen. Ehrlich dazu: fuer §22s Grenze von
    # 2.000 ms reicht es allein **nicht** — das Artefakt muss zusaetzlich
    # aufgeteilt werden.
    #
    # Hier im vhost statt in der globalen Konfiguration, weil der Produktionshost
    # fremde Produktivstapel traegt und fuer ihn gilt: nichts anfassen, was
    # nicht `vorschicht` heisst.
    gzip_proxied  any;
    gzip_vary     on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
